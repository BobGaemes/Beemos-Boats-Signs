plugins {
    id 'eclipse'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
}

version = '2.0.3'
base.archivesName = "BeemosBoatsSigns"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.4.18"

    runs {
        client {
            client()
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

mixin {
    if (file("src/main/resources/beemos_boat_signs.mixins.json").exists()) {
        add sourceSets.main, "beemos_boat_signs.refmap.json"
        config "beemos_boat_signs.mixins.json"
    }
}

dependencies {
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    if (file("src/main/resources/beemos_boat_signs.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "beemos_boat_signs.mixins.json"
        ])
    }
}
